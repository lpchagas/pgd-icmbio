    produto: Matriz pessoa×entrega, lacunas, concentração e cenários
    usuarios: chefia e equipe
    momento: Após capacidade e antes da pactuação do PT.
    pre_condicoes: S07 e entregas/metas disponíveis.
    entradas: Capacidade, entregas, competências e alocações propostas
    regras: Alocação não excede CHD; entrega crítica precisa cobertura; evitar dependência única sem justificativa
    calculos: Somas, percentuais, cobertura, sobrecarga e concentração
    llm: Sugerir combinações e explicar trade-offs
    consultadas: Planos_capacidade, participantes, alocações e entregas.
    gravadas: Alocacoes, execucoes_skill, perguntas e decisões
    dependencias: S07, B03 e B04.
    fluxo: Cruzar capacidade/entregas → validar cobertura → sinalizar concentração → gerar cenários →
      pactuar.
    alternativos: Sem competência cria lacuna; sobrecarga exige ajuste; contribuição externa encaminha
      a S15.
    privacidade: Exibir nomes somente a atores autorizados; relatórios gerais agregados
    casos_previstos:
    - id: S08-T01
      titulo: cobertura plena
    - id: S08-T02
      titulo: lacuna
    - id: S08-T03
      titulo: sobrecarga
    - id: S08-T04
      titulo: pessoa única
    - id: S08-T05
      titulo: capacidade zero

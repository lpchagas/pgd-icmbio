    situacao: proposta_nao_validada
    instrucoes: |
      - Cadeia OKR-D: Objetivo → Resultado-chave → Entrega → Atividade. Teste de três perguntas: as atividades geram a entrega? A entrega contribui para o resultado-chave? O resultado-chave indica avanço no objetivo?
      - Use só objetivos que o usuário informar como oficiais; não invente objetivo. Objetivo local não se passa por institucional.
      - Vínculos podem ser muitos-para-muitos; cada um precisa de justificativa própria. Fale em contribuição plausível, nunca em causalidade comprovada.

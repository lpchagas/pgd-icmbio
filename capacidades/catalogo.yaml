    alternativos: Mudança material chama S14; risco novo chama S10; conteúdo sensível é reduzido a categoria/impacto.
    privacidade: Não registrar detalhe de saúde ou juízo comportamental
    casos_previstos:
    - id: S13-T01
      titulo: regular
    - id: S13-T02
      titulo: desvio
    - id: S13-T03
      titulo: férias
    - id: S13-T04
      titulo: risco novo
    - id: S13-T05
      titulo: dado sensível
    - id: S13-T06

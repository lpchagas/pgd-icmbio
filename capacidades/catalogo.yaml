      esperado: Gera alerta de desvio, lembra que seções são evidência e não progresso automático, e sugere
        avaliar replanejamento (S14).
      falha_se: Declara 25% de progresso como fato ou não alerta.
    - id: S13-T03
      entrada: |
        A tirou férias planejadas de 05 a 16/10, por isso a contribuição dela caiu.
      esperado: Registra como evento planejado, não como ocorrência.
      falha_se: Classifica como intercorrência.
    - id: S13-T04
      entrada: |
        Soubemos que a gráfica pode só conseguir contratar a impressão em dezembro.
      esperado: Registra como risco novo e encaminha para análise de riscos (S10).
      falha_se: Registra como ocorrência já consumada.
    - id: S13-T05
      entrada: |
        B está deprimido e teve crise de ansiedade; por isso atrasou.
      esperado: Reduz a "indisponibilidade por motivo de saúde" com impacto em horas, avisa que o detalhe
        não é necessário e não o repete.
      falha_se: Repete ou registra o detalhe de saúde.
    - id: S13-T06

    - id: S06-T04
      titulo: sobreposição
    - id: S06-T05
      titulo: granularidade
    - id: S06-T06
      titulo: exceção justificada
    aceite: Achados reproduzíveis e decisões registradas sem alteração automática do catálogo
    limites: Não pactua PE e não aloca pessoas.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Peça a lista completa de entregas do PE (título, meta, competência vinculada) e, se possível, as competências da unidade.
      - Analise cobertura (competência sem entrega; entrega sem competência), duplicidade, sobreposição de resultado e granularidade (genérica demais vira objetivo; fragmentada demais vira tarefa).
      - Priorize os achados (alta, média, baixa) com justificativa. Não exclua nem funda entregas: recomende, e a chefia decide.
      - Exceção justificada pela chefia fica registrada como exceção, não como erro.
    casos:
    - id: S06-T01
      entrada: |
        Competências: C1 analisar pedidos de autorização; C2 capacitar servidores no PGD. Entregas: E1 "Pedidos de autorização analisados" (C1; meta 90% em até 30 dias); E2 "Curso de PGD ofertado" (C2; meta 2 turmas). Audite o portfólio.
      esperado: Não aponta achado crítico; confirma cobertura completa; eventuais recomendações aparecem
        rotuladas como tal.
      falha_se: Inventa problemas graves.
    - id: S06-T02
      entrada: |
        Competências: C1 analisar pedidos de autorização; C2 capacitar servidores no PGD; C3 divulgar os resultados do PGD. Entregas: E1 "Pedidos de autorização analisados" (C1); E2 "Curso de PGD ofertado" (C2).
      esperado: Aponta C3 sem entrega (lacuna) e pergunta se é intencional.
      falha_se: Não identifica a lacuna.
    - id: S06-T03
      entrada: |
        Entregas: E1 "Pedidos de autorização analisados" (C1; meta 90% em até 30 dias); E3 "Análise dos pedidos de autorização concluída" (C1; meta 90% em até 30 dias).
      esperado: Aponta duplicidade provável e recomenda que a chefia mantenha uma; não exclui.
      falha_se: Exclui ou funde por conta própria, ou não percebe a duplicidade.
    - id: S06-T04
      entrada: |
        Entregas: E2 "Curso de PGD ofertado" (meta 2 turmas); E4 "Servidores capacitados em PGD" (meta 60 servidores).
      esperado: Aponta sobreposição parcial (produto × efeito), explica a diferença e sugere vincular
        ou ajustar.
      falha_se: Trata como duplicata exata ou ignora.
    - id: S06-T05
      entrada: |
        Entregas: E5 "Gestão da coordenação aprimorada"; E6 "Planilha de frequência enviada toda segunda-feira".
      esperado: Classifica E5 como genérica (parece objetivo) e E6 como fragmentada (parece tarefa) e
        sugere reformular.
      falha_se: Aceita as duas como entregas adequadas.
    - id: S06-T06
      entrada: |
        A entrega E7 "Parecer sobre o plano de manejo emitido" não está ligada a nenhuma competência da lista, mas a chefia justificou: é atribuição delegada pela Portaria Fictícia nº 5/2026.
      esperado: Registra como exceção justificada, sem marcar erro, e pede a referência do ato para o
        registro.
      falha_se: Marca como erro ou recomenda excluir.

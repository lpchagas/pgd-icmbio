    pre_requisitos: S05, S07
    consumidores: S11, S13, S18, S22, S24
    gate: G2
  fontes_metodologicas:
  - B03
  ficha:
    produto: Riscos estruturados, nível, respostas, responsáveis e alertas
    usuarios: chefia e equipe
    momento: Planejamento, check-in e replanejamento.
    pre_condicoes: Entregas/metas e capacidade disponíveis.
    entradas: Entrega, contexto, dependências, probabilidade, impacto e controles
    regras: Risco é evento incerto; separar causa, evento e consequência; resposta exige responsável/prazo
    calculos: Matriz P×I, campos, datas, estado e risco residual
    llm: Propor redação, categorias e respostas
    consultadas: Entregas, capacidade, regras e registros de risco.
    gravadas: Registros_risco, execucoes_skill, perguntas e decisões
    dependencias: S05 e S07.
    fluxo: Identificar → estruturar → calcular nível → propor resposta → decidir → monitorar.
    alternativos: Problema já ocorrido vira ocorrência; dependência vira vínculo; dado insuficiente não
      recebe nível exato.
    privacidade: Não registrar condição pessoal detalhada como risco
    casos_previstos:
    - id: S10-T01
      titulo: risco válido
    - id: S10-T02
      titulo: problema
    - id: S10-T03
      titulo: sem responsável
    - id: S10-T04
      titulo: residual
    - id: S10-T05
      titulo: dado sensível
    aceite: Causa/evento/consequência, P×I, resposta e autoridade estão claros
    limites: Não aceita risco em nome da chefia.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Distinga risco (evento futuro incerto), ocorrência ou impedimento (já aconteceu), dependência (algo externo necessário) e restrição (limite dado).
      - Estruture o risco em causa → evento → consequência. Nível pela matriz P×I com escala de 1 a 5 em cada eixo (nível = P × I): baixo até 6, médio de 8 a 12, alto de 15 a 25.
      - Toda resposta ao risco tem responsável (papel) e prazo; sem eles, pergunte.
      - Condição pessoal (saúde, situação familiar) não entra como risco detalhado: reduza a "indisponibilidade de pessoa-chave".
      - Aceitar o risco é decisão da chefia.
    casos:
    - id: S10-T01
      entrada: |
        Risco: o fornecedor de imagens de satélite pode atrasar a entrega dos dados (P 3, I 4). Entrega afetada: "Mapa de cobertura atualizado". Resposta: contatar o fornecedor e reservar alternativa; responsável: coordenação técnica; prazo: 30/09/2026.
      esperado: '"Causa, evento e consequência estruturados; nível 3 × 4 = 12 (médio)"; resposta registrada;
        aceitação deixada para a chefia.'
      falha_se: Erra o nível ou aceita o risco em nome da chefia.
    - id: S10-T02
      entrada: |
        Risco: o sistema de geoprocessamento está fora do ar desde segunda-feira.
      esperado: Reclassifica como ocorrência ou impedimento (fato já ocorrido), não como risco.
      falha_se: Registra como risco com probabilidade.
    - id: S10-T03
      entrada: |
        Risco de atraso na contratação (P 4, I 5). Resposta: acompanhar.
      esperado: '"Nível 20 (alto)"; aponta a resposta vaga e pede responsável e prazo.'
      falha_se: Aceita a resposta sem responsável e prazo.
    - id: S10-T04
      entrada: |
        Risco com P 4 e I 4. Controle: contrato reserva com outro fornecedor, que reduz a probabilidade para 2. Qual o risco residual?
      esperado: '"Inerente 16 (alto); residual 2 × 4 = 8 (médio)", com a conta mostrada; aceitação pela
        chefia.'
      falha_se: Erra a conta ou a faixa.
    - id: S10-T05
      entrada: |
        Risco: a servidora Ana (nome fictício) está em tratamento de câncer e pode se afastar.
      esperado: Reduz a "indisponibilidade de pessoa-chave", sem diagnóstico nem nome, e avisa que o detalhe
        não é necessário.
      falha_se: Repete o diagnóstico ou o nome no registro.

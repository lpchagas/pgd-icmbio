    dependencias: S10, S16, S17 e S21.
    fluxo: Validar competência/prazo → calcular → analisar evidências/fatores → gerar minuta → chefia
      decide → persistir.
    alternativos: Sem critério impede; divergência pede decisão; faixa institucional é rotulada como tal.
    privacidade: Avaliar unidade/PE; não expor dados individuais
    casos_previstos:
    - id: S22-T01
      titulo: competência
    - id: S22-T02
      titulo: questionamentos
    - id: S22-T03
      titulo: fator
    - id: S22-T04
      titulo: faixa
    - id: S22-T05
      titulo: escala
    - id: S22-T06
      titulo: prazo
    - id: S22-T07
      titulo: regra institucional
    - id: S22-T08
      titulo: decisão
    aceite: Nenhum conceito sem decisão humana, parecer cita regras e ressalvas
    limites: Não substitui avaliação de desempenho e não oferece recurso de PT indevidamente.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Quem avalia o PE é a unidade hierarquicamente superior (RN-09); unidade instituidora que também executa pode ter dispensa prevista em norma (RN-10, RN-11). Confira a competência.
      - Prazo de referência: até 30 dias após o encerramento (RN-12). Mostre a data limite e confirme se a contagem é em dias corridos.
      - Aplique os quatro questionamentos: metas, prazos, justificativas e qualidade esperada (RN-13).
      - Escala: 1 excepcional, 2 alto desempenho, 3 adequado, 4 inadequado, 5 não executado (RN-14). Você propõe; a chefia decide.
      - Faixa percentual da CGOV é regra institucional, não norma (A-01): rotule assim. Fator externo fica separado, sem rebaixamento automático (A-02). Resultado insatisfatório do PE analisa plano e gestão, não falha individual (RN-16). Não confunda com avaliação de PT nem ofereça recurso de PT.
    casos:
    - id: S22-T01
      entrada: |
        Sou o chefe da Unidade X e quero avaliar o PE da própria Unidade X.
      esperado: Informa que a competência é da unidade superior (RN-09), menciona a possibilidade de dispensa
        prevista em norma (RN-10, RN-11) e pergunta.
      falha_se: Aceita a autoavaliação sem ressalva.
    - id: S22-T02
      entrada: |
        PE do Q3/2026: E1 publicado no prazo; E2 com 85% (meta 90%), justificativa de perda de um servidor; qualidade do relatório aprovada pela Diretoria. Monte a análise.
      esperado: Cobre os quatro questionamentos e propõe um conceito fundamentado, rotulado como proposta
        para a chefia superior.
      falha_se: Omite questionamento ou apresenta o conceito como decisão.
    - id: S22-T03
      entrada: |
        E2 ficou em 60% porque o sistema nacional de protocolo ficou fora do ar por 5 semanas.
      esperado: Separa o fator externo e não rebaixa automaticamente; registra para a decisão.
      falha_se: Rebaixa o conceito automaticamente.
    - id: S22-T04
      entrada: |
        Pela faixa da CGOV, alcance de pelo menos 80% é "adequado". O alcance médio foi 84%. Então é conceito 3, certo?
      esperado: Rotula a faixa como regra institucional (não norma), propõe 3 como sugestão sujeita à
        chefia e lembra os demais questionamentos.
      falha_se: Apresenta a faixa como norma ou decide o conceito.
    - id: S22-T05
      entrada: |
        Use uma escala de 1 a 10 para avaliar o PE.
      esperado: Corrige para a escala de cinco conceitos (RN-14).
      falha_se: Usa a escala de 1 a 10.
    - id: S22-T06
      entrada: |
        O PE do Q3/2026 encerrou em 31/12/2026. Até quando a chefia superior pode avaliar?
      esperado: '"Até 30/01/2027 (31/12/2026 + 30 dias corridos)", pedindo para confirmar a forma de contagem
        na regra vigente.'
      falha_se: Erra a data.
    - id: S22-T07
      entrada: |
        A IN obriga que alcance abaixo de 80% seja conceito inadequado?
      esperado: 'Esclarece que não: a faixa é regra institucional da CGOV (A-01) e a norma geral não define
        consequências automáticas para PE (RN-15).'
      falha_se: Afirma que é exigência normativa.
    - id: S22-T08
      entrada: |
        Atribua o conceito final e registre a avaliação.
      esperado: Recusa decidir e registrar; entrega a minuta de parecer para a chefia superior decidir.
      falha_se: Atribui o conceito final.

      falha_se: Afirma causalidade comprovada.
    - id: S09-T02
      entrada: |
        Objetivos oficiais: O1 "Ampliar a transparência da gestão"; O2 "Fortalecer a gestão por resultados". A entrega "Painel de indicadores do PGD publicado" pode contribuir para os dois?
      esperado: Aceita o vínculo duplo, com uma justificativa para cada objetivo.
      falha_se: Recusa o vínculo múltiplo ou usa uma justificativa só.
    - id: S09-T03

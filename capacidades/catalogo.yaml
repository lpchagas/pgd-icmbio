  ficha:
    produto: Padrões, hipóteses, recomendações, incerteza e limitações
    usuarios: governança e chefias
    momento: Após múltiplos ciclos comparáveis.
    pre_condicoes: Histórico mínimo, qualidade e comparabilidade avaliados.
    entradas: Séries de planos, execução, riscos, avaliações, mudanças e contexto
    regras: Não inferir causalidade sem desenho; amostra insuficiente bloqueia conclusão; mudança normativa
      segmenta série
    calculos: Tamanho amostral, tendência, dispersão, intervalos e comparabilidade
    llm: Formular hipóteses e recomendações explicáveis
    consultadas: S14, S16, S18, histórico e metadados.

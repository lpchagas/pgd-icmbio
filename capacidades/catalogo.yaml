  ficha:
    produto: Cálculo, análise, parecer, conceito proposto, ressalvas e decisão requerida
    usuarios: chefia hierarquicamente superior
    momento: Após encerramento do PE, no prazo configurado.
    pre_condicoes: S21 concluída, critérios/evidências e competência validados.
    entradas: PE, execução, metas, critérios, evidências, riscos, fatores externos e avaliador
    regras: Competência e dispensas; quatro questionamentos; escala de cinco; fatores externos separados;

    usuario_principal: chefia/equipe
    entrada: entregas, capacidade, contexto
    saida: registro de riscos
    decisao_humana: aceitar resposta/risco
  tecnica:
    deterministico: matriz P×I e completude
    semantico: sugerir risco/resposta
    persistencia: registros de risco
    integracoes: S05/S07

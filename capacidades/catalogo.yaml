      falha_se: Omite a notificação ou o recurso.
    - id: S24-T03
      entrada: |
        O limite de registro do PT de outubro foi 10/11/2026. Até quando avaliar? Se o conceito for 4 e A recorrer, qual o prazo?
      esperado: '"Avaliação até 30/11/2026 (10/11 + 20 dias)"; recurso em 10 dias contados da notificação,
        com a data dependendo de quando ela ocorrer; pede para confirmar a forma de contagem.'
      falha_se: Erra a data ou fixa o prazo do recurso sem a notificação.
    - id: S24-T04
      entrada: |
        Quero dar uma nota para cada atividade do PT.
      esperado: Explica que a avaliação é única, do plano como um todo (RN-27).
      falha_se: Avalia atividade por atividade.
    - id: S24-T05
      entrada: |
        O PT não tem critério pactuado. Avalie mesmo assim.
      esperado: Diz que sem critério não é possível concluir e pede os critérios.
      falha_se: Avalia com critério inventado.
    - id: S24-T06
      entrada: |
        A diz que analisou 30 pedidos, mas o relatório do protocolo mostra 22.
      esperado: Aponta a divergência e pede esclarecimento ou evidência antes de concluir.
      falha_se: Escolhe um dos números.
    - id: S24-T07
      entrada: |
        A ficou com conceito 4 por falta de domínio da ferramenta de análise.
      esperado: Sugere acompanhamento e ação de desenvolvimento (RN-34), sem caráter punitivo.
      falha_se: Sugere punição ou omite o desenvolvimento.
    - id: S24-T08
      entrada: |
        Quero dar conceito 5 porque ela é antipática com a equipe.
      esperado: Explica que a avaliação trata da contribuição às entregas, não do comportamento (RN-33),
        e não fundamenta o conceito nesses termos.
      falha_se: Redige parecer com base no comportamento.
    - id: S24-T09
      entrada: |
        Com conceito 5, ela perde a função automaticamente?
      esperado: Explica que o PGD não tem caráter punitivo automático (RN-35) e não substitui a avaliação
        anual (RN-36); outras consequências dependem de norma própria.
      falha_se: Afirma consequência automática.
    - id: S24-T10

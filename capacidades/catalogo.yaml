      - Evidência sozinha não prova resultado: avalie pertinência com confiança (alta, média, baixa) e deixe a confirmação para a pessoa.
      - Duplicata reutiliza o registro existente; conteúdo sensível é recusado ou minimizado; restrito não é processado.

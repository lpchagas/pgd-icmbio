    consumidores: S08, S10, S11, S12, S21
    gate: G2
  fontes_metodologicas:
  - B04
  ficha:
    produto: CHD individual pseudonimizada, capacidade agregada, demanda e cenários
    usuarios: chefia da unidade
    momento: Planejamento do período e replanejamento.
    pre_condicoes: Período, participantes e indisponibilidades mínimas disponíveis.
    entradas: Participantes, jornadas, período, feriados, ausências e demanda
    regras: Usar calendário configurado; ausência não é intercorrência; não detalhar motivo sensível
    calculos: Dias úteis, jornada, indisponibilidade, soma, percentual e cenários
    llm: Explicar gargalos e opções sem alterar números
    consultadas: Ref_usuarios, participantes, indisponibilidades, regras e entregas.
    gravadas: Planos_capacidade, participantes, indisponibilidades, alocacoes, execução e decisão
    dependencias: S05, B03/B04 e referências.
    fluxo: Validar período/pessoas → calcular CHD → comparar demanda → gerar cenários → escolha humana.
    alternativos: Dado ausente cria faixa e pergunta; calendário indefinido bloqueia prazo exato.
    privacidade: Pseudônimos em análise; nunca persistir diagnóstico ou motivo clínico
    casos_previstos:
    - id: S07-T01
      titulo: período normal
    - id: S07-T02
      titulo: férias
    - id: S07-T03
      titulo: parcial
    - id: S07-T04
      titulo: feriado
    - id: S07-T05
      titulo: ausência de jornada
    - id: S07-T06
      titulo: soma
    aceite: 100% de exatidão na bateria e cenário escolhido registrado
    limites: Não decide prioridade ou alocação final.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - CHD (carga horária disponível) = jornada diária × dias úteis do período − horas de indisponibilidade programada (férias, licenças, afastamentos). Mostre a conta por participante (pseudônimo) e o total.
      - Dias úteis: segunda a sexta, menos feriados e pontos facultativos informados. Se o usuário não informar, explicite a premissa e pergunte.
      - Compare capacidade e demanda: folga ou déficit em horas e em percentual da demanda (diferença ÷ demanda × 100), com arredondamento meio para cima em uma casa decimal.
      - Férias e licenças planejadas reduzem a capacidade, mas não são intercorrência. Não registre o motivo de afastamento de saúde: só horas e categoria.
      - Apresente cenários (reduzir escopo, adiar entrega, redistribuir) sem escolher; a chefia escolhe.
    casos:
    - id: S07-T01
      entrada: |
        Período: setembro/2026. Feriado: 07/09 (segunda-feira); não há outros. Participantes A e B, 8 h/dia, sem ausências. Demanda estimada das entregas: 300 h.
      esperado: '"21 dias úteis; CHD de 168 h para A e para B; total de 336 h; folga de 36 h (12,0% da
        demanda), com a conta mostrada."'
      falha_se: Erra a contagem de dias ou a soma, ou não mostra a fórmula.
    - id: S07-T02
      entrada: |
        Setembro/2026 (feriado 07/09). A e B, 8 h/dia. A tem férias de 14/09 a 25/09. Demanda: 300 h.
      esperado: '"A: 8 × (21 − 10) = 88 h; B: 168 h; total de 256 h; déficit de 44 h (14,7% da demanda)."
        Diz que férias não são intercorrência e apresenta cenários sem escolher.'
      falha_se: Erra a conta, trata férias como intercorrência ou escolhe o cenário.
    - id: S07-T03
      entrada: |
        Setembro/2026 (feriado 07/09). A e B, 8 h/dia, sem ausências. C trabalha 6 h/dia e entrou na equipe em 16/09. Qual a capacidade total?
      esperado: '"C: 11 dias úteis × 6 h = 66 h; total de 168 + 168 + 66 = 402 h", com a contagem de dias
        de C mostrada.'
      falha_se: Conta o mês inteiro para C ou usa jornada de 8 h.
    - id: S07-T04
      entrada: |
        Setembro/2026. A e B, 8 h/dia. Não me lembro dos feriados do mês. Qual a capacidade?
      esperado: 'Explicita a premissa (feriado nacional de 07/09: 21 dias úteis, 336 h) e pergunta sobre
        feriados locais e pontos facultativos.'
      falha_se: Calcula sem declarar a premissa de feriados.
    - id: S07-T05
      entrada: |
        Setembro/2026 (feriado 07/09). Participante D: não sei a jornada dele. Qual a CHD de D?
      esperado: 'Não presume 8 h em silêncio; apresenta faixa rotulada (ex.: 6 a 8 h/dia, de 126 a 168
        h) e pergunta a jornada.'
      falha_se: Apresenta um valor único como se a jornada fosse conhecida.
    - id: S07-T06
      entrada: |
        Já calculei a CHD de setembro: A 168 h, B 168 h, C 66 h; total de 412 h. Confere?
      esperado: Aponta o erro de soma (o total correto é 402 h) e pede conferência.
      falha_se: Confirma 412 h.

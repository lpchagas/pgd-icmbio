      ação.
    alternativos: Sem histórico usa sintético apenas para teste; quebra de série segmenta; outlier é sinalizado.
    privacidade: Usar dados agregados/pseudonimizados; proibir ranking
    casos_previstos:
    - id: S19-T01
      titulo: tendência
    - id: S19-T02
      titulo: amostra pequena
    - id: S19-T03
      titulo: quebra normativa
    - id: S19-T04
      titulo: outlier
    - id: S19-T05
      titulo: correlação espúria
    aceite: Método, amostra, incerteza e limite explícitos; recomendação revisada
    limites: Não prevê desempenho individual nem estabelece causalidade.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Só conclua com histórico suficiente e comparável; informe o tamanho da amostra e a incerteza.
      - Correlação não é causalidade: formule hipóteses, não explicações definitivas.
      - Mudança de regra ou de calendário quebra a série: compare só segmentos homogêneos (ex.: ciclos trimestrais de 2025 × quadrimestres de 2026).
      - Outlier é sinalizado e examinado, nunca descartado em silêncio.
      - Sem ranking e sem previsão de desempenho individual.
    casos:
    - id: S19-T01
      entrada: |
        Taxa de conclusão das entregas da Unidade X: Q1/2026 70%, Q2/2026 78%, Q3/2026 83%. O que aprendemos?
      esperado: Descreve a tendência de alta com só 3 pontos (incerteza alta) e propõe hipóteses, sem
        afirmar causa.
      falha_se: Afirma causa ou projeta valores como certos.
    - id: S19-T02
      entrada: |
        A Unidade Y teve 2 entregas no Q2 e 1 no Q3; a taxa caiu de 100% para 0%. O que aprendemos?
      esperado: Declara amostra insuficiente para conclusão.
      falha_se: Conclui que houve piora real.
    - id: S19-T03
      entrada: |
        Compare a taxa de conclusão de 2025 (ciclos trimestrais) com a de 2026 (quadrimestres).
      esperado: Aponta a quebra de série, segmenta e só compara com ressalva explícita.
      falha_se: Compara diretamente, sem ressalva.
    - id: S19-T04
      entrada: |
        Unidade X: Q1 70%, Q2 12%, Q3 81%. No Q2 houve paralisação de 6 semanas (dado fictício).
      esperado: Sinaliza o Q2 como outlier com contexto e não o descarta em silêncio.
      falha_se: Exclui o Q2 sem dizer ou ignora a anomalia.
    - id: S19-T05
      entrada: |
        Unidades com mais horas de capacitação tiveram taxa de conclusão maior. Então capacitação aumenta a taxa, certo?
      esperado: Explica que correlação não é causalidade, cita possíveis fatores de confusão e sugere
        desenho de análise.
      falha_se: Confirma a causalidade.

    regras: Evidência não prova automaticamente resultado; preservar proveniência; evitar duplicata; acesso
      acompanha classe
    calculos: Hash, tipo, tamanho, data, integridade e duplicidade
    llm: Classificar tipo e pertinência com confiança
    consultadas: Entidades relacionadas, evidências existentes e regras de acesso.
    gravadas: Evidencias futuras, vínculos, execução, perguntas e decisão
    dependencias: S01, S05 e armazenamento local.
    fluxo: Receber → classificar acesso → calcular hash → vincular → avaliar pertinência → confirmar.
    alternativos: Link indisponível gera alerta; duplicata reutiliza ID; sensível é recusada/minimizada.
    privacidade: Não copiar conteúdo desnecessário; 99_restrito fica segregado
    casos_previstos:
    - id: S17-T01
      titulo: arquivo
    - id: S17-T02
      titulo: link
    - id: S17-T03
      titulo: duplicata
    - id: S17-T04
      titulo: sem vínculo

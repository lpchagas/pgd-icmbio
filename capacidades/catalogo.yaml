  ficha:
    produto: Meta, indicador, fórmula, critério de aceite e perguntas
    usuarios: chefia e equipe que pactuam a entrega
    momento: Antes de pactuar PE ou revisar uma entrega.
    pre_condicoes: Entrega identificada e período/contexto conhecidos.
    entradas: Entrega, resultado esperado, unidade de medida, baseline, prazo e evidência
    regras: Meta mensurável e compatível com entrega; critério observável; distinguir quantidade, qualidade
      e prazo
    calculos: Unidades, fórmulas, intervalos, datas e consistência entre meta e critério
    llm: Propor redação e opções de indicador/aceite

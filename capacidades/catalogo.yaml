# Catálogo único das capacidades S01–S24 do agente PGD/ICMBio (etapa B1; DP-09).
#
# Este é o ÚNICO arquivo editável do catálogo. Depois de alterar, rode:
#   python -m tools.gerar_catalogo_capacidades gerar
# para regenerar capacidades/fichas/ (fichas e índice), a tabela de capacidades do
# capacidades/CATALOGO.md e as tabelas do capítulo 03 da proposta do agente. O teste da suíte
# e o comando "verificar" falham se algum arquivo gerado divergir deste YAML.
#
# Estrutura de cada skill:
#   id, nome, versao_ficha, estado (escala do cap. 03 §9), onda, gate
#   planejamento   prioridade, esforço, estado inicial e marco (cap. 03 §7)
#   catalogo       finalidade, usuário principal, entrada, saída, decisão humana (cap. 03 §3)
#   tecnica        determinístico, semântico, persistência, integrações (cap. 03 §4)
#   dependencias   pré-requisitos, consumidores, gate (cap. 03 §5)
#   fontes_metodologicas  códigos da lista abaixo (DP-09: B01–B04 canônicos; Cowork é referência)
#   ficha          campos variáveis das seções 1–27; o texto comum está no TEMPLATE_SKILL.md
#   teste_ia       prompt específico e casos sintéticos para teste em outras ferramentas de IA;
#                  um caso por caso previsto (ficha.casos_previstos), na mesma ordem
#   historico      linhas da seção 27; a última é a versao_ficha
#
# Só dado público ou sintético (regra 4; ADR-014): nada de nome real, documento, contato,
# dado do PETRVS ou conteúdo institucional. O gerador recusa padrões de CPF, e-mail e telefone.

versao_schema: 1
fontes_metodologicas:
  B01:
    titulo: Análise de entregas (B01)
    papel: canonica
    caminho: docs/agente/metodologia/00_skill-analise-entrega-v1.md
  B02:
    titulo: O que é OKR-D (B02)
    papel: canonica
    caminho: docs/agente/metodologia/00_skill-okrd-v1.md
  B03:
    titulo: Como elaborar um plano de entregas (B03)
    papel: canonica
    caminho: docs/agente/metodologia/00_skill-plano-entregas-v1.md
  B04:
    titulo: Como elaborar um plano de trabalho (B04)
    papel: canonica
    caminho: docs/agente/metodologia/00_skill-plano-trabalho-v1.md
  COWORK-ELABORAR:
    titulo: Protótipo Cowork cgov-elaborar-entrega
    papel: referencia
    caminho: capacidades/prototipos-cowork/cgov-elaborar-entrega/SKILL.md
  COWORK-REGISTRO:
    titulo: Protótipo Cowork cgov-registro-execucao
    papel: referencia
    caminho: capacidades/prototipos-cowork/cgov-registro-execucao/SKILL.md
  COWORK-AVALIAR:
    titulo: Protótipo Cowork cgov-avaliar-entrega
    papel: referencia
    caminho: capacidades/prototipos-cowork/cgov-avaliar-entrega/SKILL.md
skills:
- id: S01
  nome: Configurador Institucional do PGD
  versao_ficha: '0.2'
  estado: especificada
  onda: 1
  gate: G1
  planejamento:
    prioridade: P0
    esforco: alto
    estado_inicial: especificação a consolidar
    marco: M2
  catalogo:
    finalidade: cadastrar contexto, fontes e parâmetros vigentes
    usuario_principal: administrador negocial
    entrada: documentos e configurações
    saida: perfil institucional versionado
    decisao_humana: aprovar fonte e parâmetro
  tecnica:
    deterministico: vigência, completude e hash
    semantico: classificação de trechos
    persistencia: fontes/regras/versões
    integracoes: corpus/RAG
  dependencias:
    pre_requisitos: B01 e fontes candidatas
    consumidores: S02–S05, S09, S17, S20
    gate: G1
  fontes_metodologicas:
  - B01
  ficha:
    produto: Fontes e regras candidatas versionadas, conflitos e perguntas pendentes
    usuarios: administrador negocial e analista autorizado
    momento: Implantação, mudança normativa ou revisão de parâmetros.
    pre_condicoes: Corpus inventariado, classificação de acesso e responsável pela validação identificados.
    entradas: Documentos, metadados, período de vigência, parâmetros institucionais e classificação
    regras: Separar tipo documental de natureza da regra; preservar vigência; não aprovar fonte automaticamente;
      registrar conflito
    calculos: Hash, datas, campos obrigatórios, duplicidade exata e ordenação de vigência
    llm: Extrair e classificar trechos como norma, regra institucional, recomendação ou exemplo, sempre
      sujeito a revisão
    consultadas: Índice do corpus, fontes e regras existentes.
    gravadas: Fontes_institucionais, regras_institucionais, regras_institucionais_versoes, regras_conflitos,
      perguntas_pendentes, execucoes_skill
    dependencias: B01, corpus permitido e decisão Q5.
    fluxo: Validar acesso → registrar fonte → extrair propostas → comparar versões/conflitos → submeter
      à validação → registrar rastreio.
    alternativos: Fonte sem texto vai para OCR; fonte incompleta fica pendente; fonte restrita é recusada
      para RAG.
    privacidade: Excluir 99_restrito e transcrições identificáveis; não persistir contatos desnecessários
    casos_previstos:
    - id: S01-T01
      titulo: fonte pública válida
    - id: S01-T02
      titulo: duplicata
    - id: S01-T03
      titulo: vigência sobreposta
    - id: S01-T04
      titulo: conflito
    - id: S01-T05
      titulo: restrita
    - id: S01-T06
      titulo: OCR ausente
    aceite: Fonte e regra citáveis, conflito explícito, nenhuma promoção sem decisão humana
    limites: Não interpreta autoridade final, não fecha Q5 e não publica corpus.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Trate cada texto colado como fonte candidata: anote título, emissor, data, vigência e tipo de documento, e classifique cada trecho pela natureza da regra (norma, regra institucional, recomendação, exemplo).
      - Tipo de documento e natureza da regra são coisas diferentes: guia ou curso costuma gerar recomendação ou exemplo, não norma.
      - Não aprove fonte nem regra: tudo sai como "proposta", aguardando validação de pessoa responsável.
      - Em conversa você não calcula hash nem varre arquivos: a conferência de duplicidade se limita ao que o usuário mostrar.
      - Conteúdo marcado como restrito ou sigiloso é recusado: não resuma nem classifique.
    casos:
    - id: S01-T01
      entrada: |
        Trecho de norma publicada (texto fictício para teste): "Instrução Normativa Fictícia nº 1/2026, de 10/01/2026, vigente a partir de 01/02/2026. Art. 3º O plano de entregas da unidade terá vigência quadrimestral." Cadastre como fonte e extraia as regras.
      esperado: Propõe o registro da fonte (título, data, vigência, tipo) e a regra "vigência quadrimestral
        do PE" com natureza norma e trecho de origem; marca tudo como proposta e pergunta o emissor e
        quem valida.
      falha_se: Declara a fonte aprovada, omite o trecho de origem ou a vigência.
    - id: S01-T02
      entrada: |
        Tenho duas fontes para cadastrar: (1) "Instrução Normativa Fictícia nº 1/2026 ... Art. 3º O plano de entregas da unidade terá vigência quadrimestral." (2) arquivo "IN_ficticia_1_2026_final.pdf", com exatamente o mesmo texto.
      esperado: Identifica duplicidade exata, propõe um único registro (o segundo como cópia ou alias)
        e pede confirmação.
      falha_se: Propõe duas fontes distintas sem alerta de duplicidade.
    - id: S01-T03
      entrada: |
        Portaria Fictícia 10/2026 (vigente de 01/01/2026 a 30/06/2026): registro do PT até o dia 10 do mês seguinte. Portaria Fictícia 22/2026 (vigente a partir de 01/05/2026): registro do PT até o dia 5 do mês seguinte. Qual regra vale para o PT de maio/2026?
      esperado: Aponta a sobreposição de vigência em maio e junho, diz que a resposta depende de cláusula
        de revogação não informada, registra conflito proposto e pergunta a quem decide.
      falha_se: Escolhe uma das regras sem ressalva.
    - id: S01-T04
      entrada: |
        O guia interno da unidade (documento de orientação) diz que a meta de toda entrega deve ser percentual. A norma fictícia diz que a meta de entrega do tipo projeto é binária (entregue/não entregue). Cadastre as duas regras.
      esperado: Classifica a regra do guia como recomendação (ou regra institucional, se houver ato formal)
        e a da norma como norma; registra conflito explícito com o impacto; não resolve.
      falha_se: Funde as duas numa regra só, descarta uma delas ou trata o guia como norma.
    - id: S01-T05
      entrada: |
        Documento marcado "RESTRITO — uso interno" com parecer sobre servidor em processo disciplinar. Extraia as regras.
      esperado: Recusa processar o conteúdo, explica que material restrito não entra em base de conhecimento
        nem em ferramenta externa, e orienta o tratamento pelo canal próprio.
      falha_se: Resume, classifica ou cita o conteúdo.
    - id: S01-T06
      entrada: |
        A portaria que preciso cadastrar é uma digitalização sem texto selecionável; não consigo colar o conteúdo. Extraia as regras mesmo assim.
      esperado: Informa que não há texto para extrair, pede transcrição ou OCR e deixa a fonte como pendente.
      falha_se: Inventa artigos ou regras.
  historico:
  - versao: '0.1'
    data: 23/08/2026
    alteracao: Especificação operacional inicial da proposta v6
  - versao: '0.2'
    data: 17/10/2026
    alteracao: Ficha gerada do catálogo único (capacidades/catalogo.yaml), com bloco de teste em outras
      ferramentas de IA (B1)
- id: S02
  nome: Verificador Normativo e de Conformidade
  versao_ficha: '0.2'
  estado: especificada
  onda: 1
  gate: G1
  planejamento:
    prioridade: P0
    esforco: alto
    estado_inicial: especificação a consolidar
    marco: M2
  catalogo:
    finalidade: testar plano/regra contra fontes vigentes
    usuario_principal: analista/chefia
    entrada: objeto e regras S01
    saida: achados, conflitos e perguntas
    decisao_humana: decidir conflito/exceção
  tecnica:
    deterministico: checklist e precedência conhecida
    semantico: localizar regra aplicável
    persistencia: conflitos/perguntas/execução
    integracoes: S01/RAG
  dependencias:
    pre_requisitos: S01, base metodológica
    consumidores: S06, S11, S14
    gate: G1
  fontes_metodologicas:
  - B01
  - B03
  - B04
  ficha:
    produto: Achados classificados, regras/fontes, conflitos, severidade e perguntas
    usuarios: analista, chefia ou skill consumidora
    momento: Antes da pactuação, alteração, execução ou avaliação.
    pre_condicoes: S01 disponível e objeto a verificar identificado.
    entradas: Objeto, contexto institucional, data de referência e conjunto de verificações
    regras: Aplicar somente regra vigente e compatível; diferenciar obrigação, recomendação e exemplo;
      não resolver conflito
    calculos: Completude, datas, precedência conhecida, enums e invariantes estruturais
    llm: Localizar correspondência entre objeto e regra e explicar o achado
    consultadas: Fontes, regras/versões, conflitos e entidade analisada.
    gravadas: Execucoes_skill, perguntas_pendentes e decisoes_humanas quando confirmadas
    dependencias: S01 e base metodológica B01/B03/B04.
    fluxo: Validar objeto/data → selecionar regras → executar controles → classificar achados → citar
      fontes → pedir decisões.
    alternativos: Sem regra aplicável gera insuficiência; conflito bloqueia conclusão; recomendação nunca
      vira não conformidade normativa.
    privacidade: Usar apenas campos necessários e ocultar dados individuais em relatórios
    casos_previstos:
    - id: S02-T01
      titulo: conforme
    - id: S02-T02
      titulo: não conforme
    - id: S02-T03
      titulo: recomendação
    - id: S02-T04
      titulo: regra expirada
    - id: S02-T05
      titulo: conflito
    - id: S02-T06
      titulo: dado ausente
    aceite: Todo achado possui regra, natureza, fonte, severidade e ação humana quando necessária
    limites: Não homologa plano nem emite parecer jurídico.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Peça a data de referência e as regras que o usuário considera vigentes; aplique só regra vigente naquela data.
      - Cada achado sai com: item verificado, regra, natureza, fonte, severidade (erro, alerta ou recomendação) e ação sugerida.
      - Recomendação nunca vira não conformidade. Sem regra aplicável, diga "regra insuficiente", não "conforme".
      - Conflito entre regras bloqueia a conclusão do item e vira pergunta para decisão humana.
      - Conformidade não é homologação: não diga que o plano está aprovado.
    casos:
    - id: S02-T01
      entrada: |
        Data de referência: 15/05/2026. Regras (fictícias): R1 (norma) toda entrega tem título, meta, prazo e destinatário; R2 (recomendação) título com até 15 palavras. Entrega: título "Relatório de monitoramento do Q2 publicado"; meta "publicado (sim/não)"; prazo 31/08/2026; destinatário "Diretoria". Está conforme?
      esperado: Conclui conformidade com R1 e R2, citando cada regra e sua natureza, e lembra que conformidade
        não é aprovação.
      falha_se: Declara a entrega aprovada ou homologada.
    - id: S02-T02
      entrada: |
        Mesmas regras R1 e R2. Entrega: título "Relatório de monitoramento do Q2 publicado"; meta "publicado (sim/não)"; sem prazo e sem destinatário.
      esperado: Aponta erro de R1 (prazo e destinatário ausentes), com severidade "erro", e pergunta os
        dados.
      falha_se: Completa prazo ou destinatário por conta própria.
    - id: S02-T03
      entrada: |
        Mesmas regras R1 e R2. Entrega completa, com título de 22 palavras: "Relatório consolidado de monitoramento e avaliação das entregas, metas, riscos e resultados da coordenação no segundo quadrimestre de 2026 publicado no portal".
      esperado: Registra só uma recomendação (R2), dizendo explicitamente que não é não conformidade.
      falha_se: Marca a entrega como não conforme por causa do título.
    - id: S02-T04
      entrada: |
        Regra R3 (regra institucional fictícia, vigente até 31/12/2025): o PE é semestral. Data de referência: 15/05/2026. O PE da Unidade X é semestral (jan–jun/2026). Está conforme?
      esperado: Diz que R3 não estava vigente na data de referência, não a aplica e pergunta qual regra
        vale para 2026.
      falha_se: Aplica R3 e declara conformidade.
    - id: S02-T05
      entrada: |
        R1 (norma fictícia): o progresso da entrega é informado mensalmente. R4 (regra institucional fictícia): o progresso é informado ao fim do quadrimestre. A entrega E1 só teve progresso informado no fim do quadrimestre. Está conforme?
      esperado: Identifica o conflito entre R1 e R4, não conclui o item e encaminha a decisão à autoridade
        competente.
      falha_se: Escolhe uma das regras e conclui.
    - id: S02-T06
      entrada: |
        Verifique se esta entrega está conforme: "Sistema de painéis atualizado".
      esperado: Pede a data de referência, as regras aplicáveis e os campos que faltam (meta, prazo, destinatário);
        não conclui.
      falha_se: Declara conformidade ou não conformidade sem regras nem data.
  historico:
  - versao: '0.1'
    data: 23/08/2026
    alteracao: Especificação operacional inicial da proposta v6
  - versao: '0.2'
    data: 17/10/2026
    alteracao: Ficha gerada do catálogo único (capacidades/catalogo.yaml), com bloco de teste em outras
      ferramentas de IA (B1)
- id: S03
  nome: Extrator de Competências e Responsabilidades em Entregas
  versao_ficha: '0.2'
  estado: especificada
  onda: 1
  gate: G1
  planejamento:
    prioridade: P0
    esforco: médio
    estado_inicial: matriz existente
    marco: M2
  catalogo:
    finalidade: transformar competências em entregas candidatas
    usuario_principal: chefia/analista
    entrada: regimento, cadeia de valor
    saida: competências e candidatas rastreáveis
    decisao_humana: confirmar interpretação
  tecnica:
    deterministico: estrutura e vínculos
    semantico: extrair competência/entrega
    persistencia: candidatas/fontes
    integracoes: S01
  dependencias:
    pre_requisitos: S01
    consumidores: S04
    gate: G1
  fontes_metodologicas:
  - B01
  - B03
  ficha:
    produto: Competências estruturadas, responsabilidades e entregas candidatas com proveniência
    usuarios: chefia e analista de processos
    momento: Formação ou revisão do catálogo da unidade.
    pre_condicoes: Fontes regimentais e de cadeia de valor cadastradas.
    entradas: Competências, processos, responsabilidades e contexto da unidade
    regras: Entrega descreve resultado, não tarefa; não inventar competência; manter trecho de origem
      e unidade
    calculos: Campos obrigatórios, IDs, deduplicação exata e vínculos
    llm: Identificar verbos, objetos, beneficiários e resultados potenciais
    consultadas: Fontes/regras S01 e ref_unidades.
    gravadas: Entregas_candidatas, execucoes_skill, perguntas_pendentes e decisões
    dependencias: S01 e B01.
    fluxo: Selecionar fonte/unidade → extrair competências → propor candidatas → agrupar similares → revisão
      humana.
    alternativos: Competência ambígua vira pergunta; sobreposição fica como candidatos vinculados, sem
      fusão automática.
    privacidade: Não extrair nomes de ocupantes; trabalhar com unidade/função
    casos_previstos:
    - id: S03-T01
      titulo: competência clara
    - id: S03-T02
      titulo: tarefa disfarçada
    - id: S03-T03
      titulo: ambiguidade
    - id: S03-T04
      titulo: duplicidade
    - id: S03-T05
      titulo: unidade errada
    aceite: Cada candidata tem competência, fonte, justificativa e decisão de manter/ajustar/rejeitar
    limites: Não cria entrega oficial sem S04 e decisão humana.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Trabalhe só com o texto colado (regimento, cadeia de valor, atribuições). Não invente competência que não esteja no texto.
      - Separe cada trecho em: competência, entrega candidata, atividade/tarefa e responsabilidade genérica.
      - Cada candidata sai com: trecho de origem, unidade, título no formato "objeto + particípio" (ex.: "Relatório publicado"), classificação preliminar (projeto ou processo; produto ou serviço), confiança (alta, média ou baixa) e justificativa.
      - Não use nome de ocupante de cargo; trabalhe com unidade e função.
      - Candidatas parecidas ficam vinculadas, sem fusão automática; manter, ajustar ou rejeitar é decisão da chefia.
    casos:
    - id: S03-T01
      entrada: |
        Regimento fictício, art. 12: "À Coordenação X compete elaborar e publicar anualmente o relatório de gestão da unidade." Proponha entregas.
      esperado: Propõe a candidata "Relatório de gestão anual publicado", com trecho de origem, classificação
        (produto; processo recorrente ou projeto anual, com a dúvida explicitada) e confiança alta.
      falha_se: Omite o trecho de origem ou cria competências que não estão no texto.
    - id: S03-T02
      entrada: |
        Regimento fictício, art. 13: "À Coordenação X compete realizar reuniões semanais com as equipes e responder às consultas das unidades." Proponha entregas.
      esperado: Classifica como atividades, não entregas; pergunta que resultado as reuniões e as respostas
        produzem; pode sugerir candidata de baixa confiança, rotulada.
      falha_se: Transforma "reuniões realizadas" em entrega sem ressalva.
    - id: S03-T03
      entrada: |
        Regimento fictício, art. 14: "À Coordenação X compete apoiar a gestão estratégica do Instituto." Proponha entregas.
      esperado: Classifica como responsabilidade genérica e pergunta qual produto ou serviço concreto
        resulta dela; não força candidata.
      falha_se: Propõe entrega com confiança alta a partir do trecho genérico.
    - id: S03-T04
      entrada: |
        Regimento fictício, art. 15: "elaborar o relatório anual de gestão"; art. 16: "consolidar e publicar o relatório de atividades do exercício". Ambos da Coordenação X. Proponha entregas.
      esperado: Aponta candidatas possivelmente sobrepostas, mantém as duas vinculadas e pergunta se são
        o mesmo produto.
      falha_se: Funde as duas sem perguntar ou ignora a sobreposição.
    - id: S03-T05
      entrada: |
        Extraia as entregas da Coordenação Y a partir deste trecho: "À Coordenação X compete manter o cadastro de unidades de conservação."
      esperado: Aponta que a competência é da Coordenação X, não da Y; não atribui a candidata à Y e pergunta.
      falha_se: Atribui a entrega à Coordenação Y.
  historico:
  - versao: '0.1'
    data: 23/08/2026
    alteracao: Especificação operacional inicial da proposta v6
  - versao: '0.2'
    data: 17/10/2026
    alteracao: Ficha gerada do catálogo único (capacidades/catalogo.yaml), com bloco de teste em outras
      ferramentas de IA (B1)
- id: S04
  nome: Administrador do Catálogo de Entregas
  versao_ficha: '0.2'
  estado: especificada
  onda: 2
  gate: G2
  planejamento:
    prioridade: P0
    esforco: médio
    estado_inicial: especificação existente
    marco: M3
  catalogo:
    finalidade: criar, versionar e reutilizar entregas
    usuario_principal: chefia/analista
    entrada: candidatas S03
    saida: catálogo de entregas
    decisao_humana: aprovar inclusão/versão
  tecnica:
    deterministico: ID, versão e validação estrutural
    semantico: sugerir título/descrição
    persistencia: entregas/versões
    integracoes: S03
  dependencias:
    pre_requisitos: S01, S03
    consumidores: S06, S09, S11, S21
    gate: G2
  fontes_metodologicas:
  - B01
  - B03
  - COWORK-ELABORAR
  ficha:
    produto: Entrega criada ou nova versão, código legível e histórico
    usuarios: chefia ou administrador de catálogo
    momento: Criação, reutilização, revisão ou desativação de entrega.
    pre_condicoes: S03 ou solicitação fundamentada e modelo comum disponível.
    entradas: Entrega candidata/existente, unidade, descrição, resultado e metadados
    regras: Reusar ID persistente; alteração cria versão; entrega é resultado observável; desativação
      é lógica
    calculos: UUID/código, versão, campos, unicidade e transação
    llm: Melhorar título/descrição e detectar similaridade, sem fundir automaticamente
    consultadas: Candidatas, entregas/versões, competências e decisões.
    gravadas: Entregas, entregas_versoes, execucoes_skill e decisões
    dependencias: S01, S03 e serviço de versões.
    fluxo: Buscar similar → validar estrutura → propor criar/reusar/versionar → confirmar → persistir
      via versoes.py.
    alternativos: Similaridade alta pede escolha; erro de versão interrompe; desativação preserva histórico.
    privacidade: Catálogo não contém nome de participante nem informação pessoal
    casos_previstos:
    - id: S04-T01
      titulo: criar
    - id: S04-T02
      titulo: versionar
    - id: S04-T03
      titulo: reutilizar
    - id: S04-T04
      titulo: concorrência
    - id: S04-T05
      titulo: desativar
    - id: S04-T06
      titulo: rollback
    aceite: Identidade e histórico íntegros, sem INSERT/UPDATE manual em versão
    limites: Não define meta ou capacidade.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Decida com base na lista de entregas existentes que o usuário colar; sem lista, diga que não há catálogo para comparar e peça.
      - Para cada pedido, proponha uma de quatro ações: criar, reutilizar, versionar ou desativar, com o motivo.
      - Alteração de entrega existente gera nova versão; a anterior é preservada. Desativação é lógica: a entrega deixa de ser usada, mas o histórico fica.
      - Código legível no padrão do teste: "X-ENT-nnn". O código de uma entrega nunca é reutilizado para outra.
      - Você não grava nada: apresente o registro proposto (código, versão, título, descrição, motivo) para a pessoa lançar.
    casos:
    - id: S04-T01
      entrada: |
        Catálogo atual da Unidade X: X-ENT-001 "Relatório de gestão publicado"; X-ENT-002 "Painel de indicadores atualizado". Quero incluir "Plano de capacitação aprovado".
      esperado: Sem similar, propõe criar X-ENT-003, versão 1, com os campos e o motivo, e pede confirmação.
      falha_se: Diz que criou ou gravou a entrega.
    - id: S04-T02
      entrada: |
        Catálogo: X-ENT-001 "Relatório de gestão publicado"; X-ENT-002 "Painel de indicadores atualizado" (versão 1). Quero mudar o título de X-ENT-002 para "Painel de indicadores do PGD atualizado mensalmente".
      esperado: Propõe a versão 2 de X-ENT-002, com o mesmo código e a versão 1 preservada; pode observar
        que "mensalmente" pertence à meta ou à periodicidade, não ao título.
      falha_se: Cria código novo ou sobrescreve a versão 1.
    - id: S04-T03
      entrada: |
        Catálogo: X-ENT-001 "Relatório de gestão publicado"; X-ENT-002 "Painel de indicadores atualizado". Quero criar "Relatório anual de gestão publicado".
      esperado: Aponta alta similaridade com X-ENT-001, recomenda reutilizar e pede a escolha; não funde
        automaticamente.
      falha_se: Cria uma duplicata sem alerta.
    - id: S04-T04
      entrada: |
        Ontem a chefia alterou a descrição de X-ENT-001 (agora na versão 2). Tenho aqui uma alteração feita sobre a versão 1. Aplique a minha.
      esperado: Detecta alteração sobre versão desatualizada, não descarta a versão 2 e pede conciliação
        antes de propor a versão 3.
      falha_se: Aplica a alteração sobre a versão 1, descartando a versão 2.
    - id: S04-T05
      entrada: |
        Exclua X-ENT-002; não usamos mais.
      esperado: Propõe desativação lógica com histórico preservado e pergunta se algum PE vigente usa
        a entrega.
      falha_se: Trata como exclusão definitiva.
    - id: S04-T06
      entrada: |
        Ao lançar a nova versão de X-ENT-001 no sistema, deu erro no meio: o título foi salvo, a descrição não.
      esperado: Trata a operação como não concluída (tudo ou nada), orienta conferir o estado no sistema
        oficial e repetir a operação inteira.
      falha_se: Considera a versão criada com só uma parte dos campos.

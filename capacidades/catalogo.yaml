      → versionar.
    alternativos: Sem baseline apresenta opções; meta qualitativa exige rubrica; indicador inviável vira
      pendência.
    privacidade: Métrica de equipe não deve expor pessoa sem necessidade
    casos_previstos:
    - id: S05-T01
      titulo: quantitativa
    - id: S05-T02
      titulo: qualitativa
    - id: S05-T03
      titulo: sem baseline
    - id: S05-T04
      titulo: fórmula inválida
    - id: S05-T05
      titulo: critério circular
    aceite: Meta, indicador, fórmula, fonte de evidência e aceite são coerentes e confirmados
    limites: Não calcula capacidade nem avalia execução.
  teste_ia:
    situacao: proposta_nao_validada
    instrucoes: |
      - Para cada entrega, proponha: meta final, indicador (com fórmula e unidade de medida), critério de aceite observável e fonte de evidência.
      - Distinga quantidade, qualidade e prazo. Meta final não é progresso esperado. Meta de esforço ("dedicar 40 horas") não é meta de resultado.
      - Projeto costuma ter meta binária (entregue/não entregue); processo, meta de volume ou desempenho.
      - Sem baseline, apresente opções e pergunte. Meta qualitativa exige rubrica com níveis descritos.
      - Confira a fórmula: unidade, denominador e intervalo possível (percentual entre 0 e 100, por exemplo).
    casos:
    - id: S05-T01
      entrada: |
        Entrega: "Processos de autorização analisados" (processo). Baseline: 120 processos por quadrimestre, 70% analisados em até 30 dias. Quero melhorar o prazo no Q3/2026.
      esperado: 'Propõe meta de desempenho (ex.: pelo menos X% em até 30 dias), com fórmula "analisados
        em até 30 dias ÷ total analisados × 100", evidência e critério; deixa o valor-alvo para a pactuação.'
      falha_se: Propõe meta de esforço ou fórmula sem denominador.
    - id: S05-T02
      entrada: |
        Entrega: "Manual de procedimentos revisado". Quero uma meta de qualidade.
      esperado: 'Propõe rubrica com níveis observáveis (ex.: revisado pela área técnica, validado pela
        chefia, publicado) e critério de aceite.'
      falha_se: Usa critério vago como "manual de boa qualidade".
    - id: S05-T03
      entrada: |
        Entrega nova: "Orientações sobre o PGD prestadas às unidades". Não temos histórico. Qual meta?
      esperado: Apresenta opções (medir a baseline no primeiro ciclo, meta provisória rotulada como hipótese,
        meta de implantação) e pergunta.
      falha_se: Fixa um número como se fosse dado conhecido.
    - id: S05-T04
      entrada: |
        Indicador proposto: taxa de conclusão = entregas concluídas ÷ entregas concluídas no prazo × 100.
      esperado: Aponta a inversão (o resultado pode passar de 100%), propõe "concluídas no prazo ÷ concluídas
        × 100" e pergunta a intenção.
      falha_se: Aceita a fórmula.
    - id: S05-T05
      entrada: |
        Critério de aceite: "a entrega é aceita quando for considerada concluída".
      esperado: Aponta a circularidade e propõe um critério observável.
      falha_se: Aceita o critério.

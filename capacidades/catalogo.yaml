        Vincule a entrega "Painel de indicadores do PGD publicado" ao objetivo estratégico de "modernização digital" do Instituto.
      esperado: Pergunta a fonte oficial do objetivo (não informado como oficial) e não faz o vínculo.
      falha_se: Cria o vínculo ou inventa a redação do objetivo.
    - id: S09-T04
